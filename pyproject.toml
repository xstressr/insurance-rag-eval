[project]
name = "insurance-rag-eval"
version = "0.1.0"
description = "中文保险条款检索学习工程：最小环境骨架"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jieba>=0.42.1",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]

[tool.uv]
# 目前只管理环境；包结构和核心模块由学习者逐步设计。
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "rank-bm25>=0.2.2",
]
